<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Misi Jelajah Pahlawan Nusantara - IPAS Kelas 6</title>
    <!-- Font Google: Poppins & Fredoka -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #FF6B6B;
            --secondary: #4ECDC4;
            --accent: #FFE66D;
            --dark: #2C3E50;
            --light: #F7F9FC;
            --white: #FFFFFF;
            --success: #2ECC71;
            --warning: #F1C40F;
            --danger: #E74C3C;
            --shadow: 0 8px 25px rgba(0,0,0,0.1);
            --radius: 20px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
            user-select: none;
        }

        body {
            background: linear-gradient(135deg, #A8EDEA 0%, #FED6E3 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
            overflow-x: hidden;
        }

        /* Container Utama */
        .game-card {
            background: var(--white);
            width: 100%;
            max-width: 900px;
            min-height: 620px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            border: 4px solid #FFF;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        /* Header / Navbar */
        .game-header {
            background: linear-gradient(90deg, #FF6B6B, #FF8E53);
            padding: 15px 25px;
            color: var(--white);
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .game-title {
            font-family: 'Fredoka', cursive;
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .stats-container {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .stat-badge {
            background: rgba(255,255,255,0.25);
            padding: 6px 14px;
            border-radius: 50px;
            font-weight: 600;
            font-size: 0.9rem;
            backdrop-filter: blur(5px);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* Content Body */
        .game-body {
            padding: 25px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .screen {
            display: none;
            animation: fadeIn 0.4s ease-in-out;
        }

        .screen.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Screen 1: Beranda */
        .hero-banner {
            text-align: center;
            margin-bottom: 25px;
        }

        .hero-banner h1 {
            font-family: 'Fredoka', cursive;
            font-size: 2.3rem;
            color: var(--dark);
            margin-bottom: 8px;
        }

        .hero-banner p {
            color: #666;
            font-size: 1rem;
        }

        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-top: 15px;
        }

        .menu-btn {
            background: var(--light);
            border: 3px solid #E2E8F0;
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .menu-btn:hover {
            transform: translateY(-6px);
            border-color: var(--primary);
            box-shadow: 0 10px 20px rgba(255,107,107,0.2);
        }

        .menu-icon {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.6rem;
            color: white;
        }

        .menu-title {
            font-family: 'Fredoka', cursive;
            font-size: 1.2rem;
            color: var(--dark);
        }

        .menu-desc {
            font-size: 0.8rem;
            color: #718096;
        }

        /* Modul Materi: Hero Cards */
        .hero-selector {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }

        .hero-chip {
            padding: 10px 18px;
            background: var(--light);
            border-radius: 50px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: 0.3s;
            border: 2px solid #E2E8F0;
        }

        .hero-chip.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .hero-detail-card {
            background: var(--light);
            border-radius: 16px;
            padding: 20px;
            display: grid;
            grid-template-columns: 180px 1fr;
            gap: 20px;
            align-items: center;
        }

        .hero-img-box {
            width: 100%;
            height: 200px;
            border-radius: 12px;
            background-size: cover;
            background-position: center;
            border: 4px solid white;
            box-shadow: var(--shadow);
        }

        .hero
